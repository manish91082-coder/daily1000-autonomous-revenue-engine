name: Import audited source package
on:
  push:
    branches: [main]
    paths:
      - daily1000-autonomous-revenue-engine-v0.1.2-audited.tar.xz

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact source archive checksum
        id: package
        shell: bash
        env:
          EXPECTED_SHA256: d17fc39c8ec15ca4d0ba2a996c01eb2a3726b8d5f25e0193cd4e2569a8fcb23e
        run: |
          archive="daily1000-autonomous-revenue-engine-v0.1.2-audited.tar.xz"
          test -f "$archive"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "Expected SHA-256: $EXPECTED_SHA256"
          echo "Actual SHA-256:   $actual"
          test "$actual" = "$EXPECTED_SHA256"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Extract source into repository root
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p .source-stage
          tar -tJf daily1000-autonomous-revenue-engine-v0.1.2-audited.tar.xz | grep -q '^daily1000-autonomous-revenue-engine/package.json$'
          tar -xJf daily1000-autonomous-revenue-engine-v0.1.2-audited.tar.xz -C .source-stage
          test -f .source-stage/daily1000-autonomous-revenue-engine/package.json
          cp -a .source-stage/daily1000-autonomous-revenue-engine/. ./
          test "$(node -p "require('./package.json').version")" = "0.1.2"
          rm -rf .source-stage daily1000-autonomous-revenue-engine-v0.1.2-audited.tar.xz

      - name: Run automated tests
        if: steps.package.outputs.present == 'true'
        run: npm test

      - name: Check JavaScript syntax
        if: steps.package.outputs.present == 'true'
        run: |
          node --check site/app.js
          node --check site/calculator.js

      - name: Commit extracted project files
        if: steps.package.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted source changes."
            exit 0
          fi
          git commit -m "chore: import audited v0.1.2 project source"
          git push
