name: CI
on:
  push:
    branches: [main, 'source-import/v0.1.2']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check site/app.js
      - run: node --check site/calculator.js
